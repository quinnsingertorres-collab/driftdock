# Compiles Driftdock on a real Mac every time you push, so a broken change
# shows up as a red ✗ on GitHub before you install it.
name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Compile
        run: swift build -c release
